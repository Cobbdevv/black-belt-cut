<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Belt Cut</title>
<meta name="description" content="Fat-loss tracker with daily eating rules, bodyweight workouts, a craving timer, belt ranks and F- to S+ stat ranks.">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Black Belt">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Black-and-white training HUD: ink-black ground on a faint mat grid, white type and rules, square panels with corner ticks,
   condensed poster headings, mono labels. Phone: sticky header + bottom tabs. Desktop (960px+): left sidebar + two-column panel flow.
   Colour only where it carries meaning: belt colours, and red for cravings and errors. */
:root {
  color-scheme: dark;
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #1b1b1b;
  --ink: #f2f2ef;
  --ink-2: #b3b3ad;
  --muted: #7a7a75;
  --line: #262626;
  --line-2: #3d3d3d;
  --accent: #f2f2ef;
  --accent-ink: #0a0a0a;
  --danger: #ff4d4f;
  --good: #f2f2ef;
  --belt-white: #ffffff;
  --belt-yellow: #f0c02c;
  --belt-orange: #e57d26;
  --belt-green: #2e8b4c;
  --belt-blue: #2b5db5;
  --belt-red: #c3242d;
  --belt-black: #050505;
  --stripe: #f4f4f1;
  --gold: #d6a630;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --side: 264px;
}

* { box-sizing: border-box; }
html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background-color: var(--bg);
  background-image: linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
  background-size: 36px 36px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
::selection { background: var(--ink); color: var(--bg); }

/* ---------- Shell ---------- */
.side { display: contents; }
.main { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 112px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 12px 16px 10px; background: rgba(10, 10, 10, .92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top > * { max-width: 608px; margin-inline: auto; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: .9; letter-spacing: .03em; text-transform: uppercase; }
.brand span { display: block; font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
.top-weight { text-align: right; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.top-weight b { display: block; font-family: var(--body); font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 700; }

.belt { position: relative; height: 16px; margin-top: 12px; background: var(--belt-color, var(--belt-white)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); overflow: hidden; }
.belt-tip { position: absolute; right: 0; top: 0; bottom: 0; width: 64px; background: var(--belt-black); display: flex; gap: 4px; align-items: center; justify-content: center; }
.belt.is-black { box-shadow: inset 0 0 0 1px var(--line-2); }
.belt.is-black .belt-tip { background: #1d1d1d; }
.belt-stripe { width: 6px; height: 100%; background: var(--stripe); opacity: .16; }
.belt-stripe.on { opacity: 1; }
.belt.is-black .belt-stripe.on { background: var(--gold); }
.belt-label { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.belt-label strong { color: var(--ink); font-weight: 600; }

/* ---------- Type ---------- */
.view { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
.section-title { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .88; letter-spacing: .01em; text-transform: uppercase; }
.section-title small { font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; color: var(--muted); margin-left: 10px; vertical-align: middle; }
.card-head > .section-title { flex: 1; }
.eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.small { font-size: 14px; color: var(--ink-2); }
.muted { color: var(--muted); }
.why { font-size: 16px; color: var(--ink); border-left: 3px solid var(--ink); padding: 2px 0 2px 12px; font-style: italic; }
.banner { font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ink); padding: 9px 12px; }

/* ---------- Panels: square, hairline, corner ticks ---------- */
.card {
  --tick: var(--ink-2);
  background:
    linear-gradient(var(--tick), var(--tick)) top left / 12px 1px no-repeat,
    linear-gradient(var(--tick), var(--tick)) top left / 1px 12px no-repeat,
    linear-gradient(var(--tick), var(--tick)) bottom right / 12px 1px no-repeat,
    linear-gradient(var(--tick), var(--tick)) bottom right / 1px 12px no-repeat,
    var(--surface);
  border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.card.accent { --tick: var(--ink); border-color: var(--line-2); box-shadow: inset 0 0 0 1px rgba(242, 242, 239, .05); }
.card.quiet { background: transparent; border: 0; padding: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head h2, .card > h2 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.card-head > .small { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

/* ---------- Controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 2px; white-space: nowrap;
  border: 1px solid var(--ink); background: var(--ink); color: var(--accent-ink);
  font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; line-height: 1;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover:not(:disabled) { background: #ffffff; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--ink); border-color: var(--line-2); }
.btn.line { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover:not(:disabled), .btn.line:hover:not(:disabled) { background: var(--surface-2); border-color: var(--ink); }
.btn.small-btn { min-height: 36px; padding: 0 12px; font-size: 16px; }
.btn:disabled { opacity: .35; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 150px; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); }
.linkish:hover { text-decoration-color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.input { width: 100%; min-height: 48px; border-radius: 2px; border: 1px solid var(--line-2); background: #0c0c0c; padding: 0 14px; font-size: 18px; }
.input:focus { outline: none; border-color: var(--ink); }
textarea.input { min-height: 88px; padding: 12px 14px; font-size: 16px; resize: vertical; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-2); background: transparent; border-radius: 2px; padding: 8px 14px; font-size: 14px; font-weight: 600; min-height: 40px; }
.chip:hover { border-color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 2px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 1px; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ---------- Today ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: var(--bg); }
.dot.full { background: var(--ink); border-color: var(--ink); }
.dot.short { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); border-color: var(--ink); }
.day.today { color: var(--ink); }
.day.today .dot { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(242, 242, 239, .14); }

.habits { display: flex; flex-direction: column; gap: 8px; }
.habit { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 2px; border: 1px solid var(--line); background: #0d0d0d; min-height: 60px; color: var(--ink); transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
.habit:hover { border-color: var(--line-2); }
.habit .tick { flex: none; width: 26px; height: 26px; border-radius: 2px; border: 1.5px solid var(--ink-2); display: grid; place-items: center; }
.habit .tick svg { width: 17px; height: 17px; opacity: 0; }
.habit-text { min-width: 0; }
.habit-text b { display: block; font-weight: 600; }
.habit-text span { font-size: 13px; color: var(--ink-2); }
.habit.done { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.habit.done .habit-text span { color: #4d4d49; }
.habit.done .tick { background: var(--bg); border-color: var(--bg); color: var(--ink); }
.habit.done .tick svg { opacity: 1; }

.crave { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 2px; border: 1px dashed var(--line-2); background: var(--surface); color: var(--ink); transition: border-color .15s ease; }
.crave:hover { border-color: var(--danger); }
.crave b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; }
.crave span { font-size: 14px; color: var(--ink-2); }
.crave svg { flex: none; width: 32px; height: 32px; color: var(--danger); }

/* ---------- Numbers ---------- */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--ink); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat .label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat .value { font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat .sub { font-size: 12px; color: var(--ink-2); }

/* ---------- Workout ---------- */
.ex { display: flex; flex-direction: column; gap: 10px; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ex-name { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase; }
.ex-cue { font-size: 14px; color: var(--ink-2); margin-top: 3px; }
.lvl { flex: none; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-2); padding: 3px 6px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 50px 44px 1fr 44px 56px; align-items: center; gap: 6px; }
.set .n { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.set .val { text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.set .val small { font-size: 12px; color: var(--muted); font-weight: 500; }
.step { width: 44px; height: 44px; border-radius: 2px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 20px; font-weight: 700; }
.step:hover { border-color: var(--ink-2); }
.ok { width: 56px; height: 44px; border-radius: 2px; border: 1.5px solid var(--line-2); background: transparent; display: grid; place-items: center; }
.ok svg { width: 20px; height: 20px; }
.set.done .ok { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.set.done .val { color: var(--ink); }
.set:not(.done) .val { color: var(--ink-2); }
.last { font-size: 13px; color: var(--muted); }
.lvl-btns { display: flex; gap: 8px; }

.timer { font-family: var(--display); font-weight: 900; font-size: 72px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer.work { text-shadow: 0 0 28px rgba(255, 255, 255, .28); }
.restbar { position: fixed; left: 0; right: 0; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 25; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
.restbar > div { pointer-events: auto; max-width: 608px; width: 100%; background: var(--ink); color: var(--bg); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
.restbar span:first-child { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.restbar b { font-family: var(--display); font-size: 30px; font-variant-numeric: tabular-nums; margin-left: 8px; letter-spacing: .02em; }
.restbar button { background: transparent; color: var(--bg); border: 1px solid var(--bg); border-radius: 2px; padding: 6px 12px; font-weight: 700; }

/* ---------- Chart ---------- */
.chart-wrap { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .cg { stroke: #202020; stroke-width: 1; }
.chart .cp { stroke: #6a6a66; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.chart .cd { fill: #77776f; fill-opacity: .7; stroke: var(--surface); stroke-width: 2; }
.chart .ct { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .ce { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.chart .cx { stroke: #5a5a56; stroke-width: 1; }
.chart text.cl { fill: var(--ink); font-weight: 600; font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; font-size: 13px; line-height: 1.3; min-width: 124px; transform: translate(-50%, -100%); }
.tip b { font-size: 16px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.key i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.table-wrap { overflow-x: auto; max-height: 340px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { font-family: var(--mono); font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }

.ladder { display: flex; flex-direction: column; gap: 9px; }
.rung { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; font-size: 15px; }
.rung .sw { height: 12px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.rung.now { font-weight: 700; }
.rung.past { color: var(--muted); }

.guide ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.hands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hand { border: 1px solid var(--line-2); padding: 10px 12px; }
.hand b { display: block; }
.hand span { font-size: 13px; color: var(--ink-2); }

/* ---------- Sheets, toasts ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 600px; max-height: 92%; overflow-y: auto; background: #0e0e0e; border-top: 1px solid var(--ink); padding: 22px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-family: var(--display); font-weight: 900; font-size: 36px; text-transform: uppercase; line-height: .95; }
.celebrate { text-align: center; align-items: center; }
.celebrate .belt { width: 100%; height: 26px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; font-weight: 600; font-size: 15px; max-width: calc(100% - 32px); box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }

/* ---------- Tabs: bottom bar on phones, sidebar list on desktop ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(10, 10, 10, .96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { position: relative; border: 0; background: none; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-height: 60px; }
.tab svg { width: 22px; height: 22px; }
.tab:hover { color: var(--ink-2); }
.tab.on { color: var(--ink); }
.tab.on::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: var(--ink); }

/* ---------- System window (manhwa status screen) ---------- */
.sys {
  --sys-line: #f2f2ef; --sys-ink: #f2f2ef; --sys-dim: #9b9b96; --sys-ok: #f2f2ef;
  background: #050505; color: var(--sys-ink); border: 1px solid var(--sys-line); padding: 14px 16px 16px;
  box-shadow: 0 0 0 4px rgba(242, 242, 239, .05), 0 0 34px rgba(242, 242, 239, .10), inset 0 0 26px rgba(242, 242, 239, .05);
  display: flex; flex-direction: column; gap: 11px; min-width: 0; width: 100%; text-align: left;
}
.sys-head { display: flex; justify-content: space-between; gap: 10px; margin: -14px -16px 4px; padding: 7px 16px; background: var(--sys-line); color: #050505; font-family: var(--mono); font-weight: 600; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
.sys-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.sys-code { font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: .06em; }
.sys-name { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-weight: 600; }
.sys-name small { font-size: 12px; font-weight: 400; color: var(--sys-dim); }
.sys-bar { display: block; height: 3px; background: #262626; overflow: hidden; }
.sys-bar i { display: block; height: 100%; background: var(--sys-line); }
.sys-note, .sys-text { font-size: 13px; color: var(--sys-dim); }
.sys-title { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: .95; letter-spacing: .03em; text-transform: uppercase; }
.btn.sys-btn { background: var(--sys-line); color: #050505; border-color: var(--sys-line); }
.sys .btn.ghost { background: #161616; color: var(--sys-ink); border-color: #3d3d3d; }
.sys .btn.line { color: var(--sys-ink); border-color: #3d3d3d; }
.sys .step { background: #161616; border-color: #3d3d3d; color: var(--sys-ink); }
.sys .linkish { color: var(--sys-ink); align-self: flex-start; }
.sys .input { background: #0c0c0c; border-color: #3d3d3d; color: var(--sys-ink); }
.sys .field label { color: var(--sys-ink); }
.sys .small { color: var(--sys-dim); }
.sys-teaser { cursor: pointer; font: inherit; transition: box-shadow .2s ease; }
.sys-teaser:hover { box-shadow: 0 0 0 4px rgba(242, 242, 239, .08), 0 0 44px rgba(242, 242, 239, .18); }
.sys-teaser b { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; }
.obj { display: flex; flex-direction: column; gap: 8px; padding-top: 11px; border-top: 1px dashed #333333; }
.obj-text { font-weight: 600; }
.obj-count { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.obj.done .obj-text { color: var(--sys-dim); text-decoration: line-through; }
.sys-timer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sys-timer span:first-child { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sys-dim); }
.sys-timer b { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 22px rgba(255, 255, 255, .3); }
.sys-stamp { align-self: center; font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .2em; text-transform: uppercase; color: var(--sys-ok); border: 2px solid var(--sys-ok); padding: 4px 16px; transform: rotate(-4deg); }
.sys-quest.is-clear { box-shadow: 0 0 0 4px rgba(242, 242, 239, .08), 0 0 48px rgba(242, 242, 239, .2); }
.trial { display: flex; flex-direction: column; gap: 14px; }

/* Ranks: brightness climbs with the tier, from a dim outline (F) to solid white with a glow (S). */
.rank { flex: none; display: inline-block; min-width: 46px; padding: 3px 8px; border: 1.5px solid; border-radius: 2px; text-align: center; font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1.1; letter-spacing: .02em; background: transparent; }
.r-F, .r-E { color: #8a8a85; border-color: #3d3d3d; }
.r-D, .r-C { color: #f2f2ef; border-color: #8a8a85; }
.r-B { color: #f2f2ef; border-color: #f2f2ef; background: #262626; }
.r-A { color: #0a0a0a; border-color: #cfcfca; background: #cfcfca; }
.r-S { color: #0a0a0a; border-color: #ffffff; background: #ffffff; box-shadow: 0 0 18px rgba(255, 255, 255, .6); }
.r-none { color: var(--muted); border-color: var(--line-2); border-style: dashed; }
.card-head .rank { font-size: 16px; min-width: 36px; padding: 1px 6px; }

/* ---------- Exercise figures: line pictograms on a dark stage ---------- */
.fg { display: block; width: 100%; height: 100%; overflow: visible; }
.fg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fg .fg-ink { stroke: var(--ink); }
.fg .fg-far { stroke: var(--muted); }
.fg .fg-halo { stroke: var(--bg); }
.fg .fg-head { fill: var(--ink); }
.fg .fg-halo-f { fill: var(--bg); }
.fg .fg-floor { stroke: var(--line-2); stroke-width: 1.2; }
.fg .fg-prop { stroke: var(--muted); stroke-width: 1.6; }
.fg .fg-hatch { stroke: var(--line-2); stroke-width: 1; }
.fg .fg-pack { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.4; }
.fg .fg-guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 2.5; }
.fg .fg-arrow { stroke: var(--ink-2); stroke-width: 1.4; }
.fg .fg-trail { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 2; }
.fg .fg-text { fill: var(--ink-2); font-family: var(--mono); font-size: 4.4px; font-weight: 600; letter-spacing: .08em; }
.fg .fg-x circle { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
.fg .fg-x path { stroke: var(--ink); stroke-width: 1.3; }
.fg-stage { position: relative; display: flex; flex-direction: column; aspect-ratio: 16 / 10; padding: 8px 8px 0; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.fg-stage > .fg { flex: 1; min-height: 0; }
.fg-stage.fg-mini, .fg-stage.fg-thumb { aspect-ratio: 4 / 3; padding: 4px; }
.fg-tempo { position: relative; flex: none; height: 24px; margin: 6px -8px 0; border-top: 1px solid var(--line); }
.fg-tempo span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fg-play { position: absolute; top: -1px; bottom: 0; left: 0; width: 2px; background: var(--ink); }
.fg-frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.fg-frames figure { margin: 0; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fg-frames .fg { height: auto; aspect-ratio: 4 / 3; padding: 3px; background: var(--bg); border: 1px solid var(--line); }
.fg-frames figcaption { font-size: 12px; line-height: 1.3; color: var(--ink-2); }
.fg-frames figcaption b { margin-right: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.fg-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.how { align-self: flex-start; font-size: 14px; }

/* ---------- Workout steps ---------- */
.session { display: flex; flex-direction: column; gap: 14px; }
.stepbar { display: flex; gap: 6px; overflow-x: auto; padding: 2px; margin: 0 -2px; scrollbar-width: none; }
.stepbar::-webkit-scrollbar { display: none; }
.sb { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 6px 10px 6px 6px; border: 1px solid var(--line-2); border-radius: 2px; background: transparent; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.sb i { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid var(--line-2); font-style: normal; font-size: 10px; }
.sb i svg { width: 13px; height: 13px; }
.sb.done i { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sb.on { border-color: var(--ink); background: var(--surface-2); color: var(--ink); }
.ex-title { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: .95; letter-spacing: .02em; text-transform: uppercase; }
.intro-grid { display: grid; gap: 16px; }
.intro-show, .intro-text { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.intro-plan { display: flex; flex-direction: column; gap: 3px; padding: 4px 0 4px 12px; border-left: 3px solid var(--ink); }
.intro-plan b { font-size: 18px; }
.work-head { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: start; }
.work-head > div { display: flex; flex-direction: column; gap: 4px; }
.work-thumb, .plan-thumb { display: block; width: 100%; padding: 0; border: 0; background: none; }
.warm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.warm-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.session-end { display: flex; flex-direction: column; gap: 10px; }
.card.plan-ex { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; align-items: start; }
.plan-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* ---------- Quests, trials, benchmarks, notes, guide library ---------- */
.obj-how { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.obj-how .small { color: var(--sys-dim); }
.sys .how { color: var(--sys-ink); font-size: 13px; }
.trial-test { padding-top: 12px; border-top: 1px dashed var(--line-2); }
.tt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tt-head .how { flex: none; white-space: nowrap; }
.tt-btn { align-self: flex-start; }
.tt-run { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.tt-clock { min-width: 2.6ch; font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.paste summary { cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); }
.paste[open] { display: flex; flex-direction: column; gap: 8px; }
.rank-move { display: inline-flex; align-items: center; gap: 6px; }
.rank-move i { font-style: normal; color: var(--sys-dim); }
.report-facts { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.tech-row { display: flex; align-items: center; gap: 10px; }
.tech-row .habit { flex: 1; min-width: 0; }
.tech-row .how { flex: none; font-size: 13px; }
.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.notes .muted { font-family: var(--mono); font-size: 11px; }
.lib-group { display: flex; flex-direction: column; gap: 8px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.lib-item { display: flex; flex-direction: column; gap: 6px; padding: 0 0 8px; border: 1px solid var(--line); background: transparent; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink); transition: border-color .15s ease; }
.lib-item:hover { border-color: var(--line-2); }
.lib-item .fg-stage { border: 0; border-bottom: 1px solid var(--line); }
.lib-item span { padding: 0 8px; line-height: 1.25; }

/* ---------- Desktop ---------- */
@media (min-width: 960px) {
  .intro-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
  .ex-title { font-size: 44px; }
  .view > .card.guide-lib { column-span: all; }
  body { background-size: 44px 44px; }
  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
  .side { display: flex; flex-direction: column; gap: 30px; position: sticky; top: 0; height: 100vh; padding: 28px 22px; border-right: 1px solid var(--line); background: rgba(8, 8, 8, .9); }
  .top { position: static; margin: 0; padding: 0; border: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .top > * { max-width: none; margin-inline: 0; }
  .top-row { flex-direction: column; align-items: flex-start; gap: 22px; }
  .brand { font-size: 38px; }
  .top-weight { text-align: left; }
  .top-weight b { font-size: 30px; }
  .belt-label { flex-direction: column; gap: 3px; }
  .tabs { position: static; background: none; border: 0; padding: 0; }
  .tabs-in { display: flex; flex-direction: column; gap: 2px; max-width: none; }
  .tab { flex-direction: row; justify-content: flex-start; gap: 14px; min-height: 46px; padding: 0 14px; font-size: 12px; border-left: 2px solid transparent; }
  .tab:hover { background: var(--surface); }
  .tab.on { background: var(--surface-2); border-left-color: var(--ink); }
  .tab.on::before { display: none; }
  .main { max-width: 1240px; margin: 0; padding: 36px 44px 72px; }
  .view { display: block; columns: 2; column-gap: 20px; padding-top: 0; }
  .view > * { margin: 0 0 20px; column-span: all; }
  .view > .card, .view > .sys, .view > .crave, .view > form.card { column-span: none; break-inside: avoid; }
  .view > .card:has(.chart) { column-span: all; }
  .view.single { columns: 1; max-width: 640px; }
  .view.single > * { column-span: none; }
  .section-title { font-size: 64px; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .scrim { align-items: center; }
  .sheet { max-width: 560px; max-height: 86vh; border: 1px solid var(--line-2); border-top-color: var(--ink); }
  .restbar { left: var(--side); bottom: 24px; }
}
@media (min-width: 1500px) {
  .main { padding-inline: 64px; }
}
@media (prefers-reduced-motion: no-preference) {
  .celebrate .belt { animation: tie .7s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes tie { from { transform: scaleX(.2); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  .view { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <header class="top" id="top">
      <div class="top-row"><div class="brand">Black Belt Cut</div></div>
    </header>
    <nav class="tabs" aria-label="Sections">
      <div class="tabs-in">
        <button class="tab on" data-tab="today" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Today</button>
        <button class="tab" data-tab="train" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
        <button class="tab" data-tab="status" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Status</button>
        <button class="tab" data-tab="progress" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M5 7l5 5 3-3 6 6"/></svg>Progress</button>
        <button class="tab" data-tab="guide" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h4"/></svg>Guide</button>
      </div>
    </nav>
  </aside>
  <div class="main">
    <main id="view" class="view">
      <div class="card">
        <h2>Loading your log</h2>
        <p class="small">Your workouts, weigh-ins, ranks and daily rules will show here. On a first visit you'll set your starting weight next.</p>
      </div>
    </main>
  </div>
</div>
<div id="restbar" class="restbar" hidden></div>
<div id="sheet" class="scrim" hidden></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<script src="logic.js"></script>
<script src="ranks.js"></script>
<script src="figure.js"></script>
<script src="moves.js"></script>
<script src="logbook.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="train.js"></script>
<script src="status.js"></script>
<script src="views.js"></script>
</body>
</html>
